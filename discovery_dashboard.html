<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FalconEdge Auto-Discovery Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .card {
            background-color: #1e293b;
            border-color: #334155;
        }

        .positive {
            color: #22c55e;
        }

        .negative {
            color: #ef4444;
        }

        .row-expanded {
            background-color: #334155 !important;
        }

        .chart-container-hidden {
            display: none;
        }

        .chart-container-visible {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Sorted column styling */
        th.sortable:hover {
            color: #fff;
            cursor: pointer;
        }

        th.sorted-asc::after {
            content: " ↑";
        }

        th.sorted-desc::after {
            content: " ↓";
        }
    </style>
</head>

<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 id="page-title" class="text-3xl font-bold text-white tracking-tight">Strategy Discovery Leaderboard
                </h1>
                <p class="text-sm text-gray-400 mt-1">Generated: <span id="gen-date">--</span> | Configurations Tested:
                    <span id="total-tested">--</span>
                </p>
                <div
                    class="flex space-x-4 mt-3 text-sm font-medium bg-gray-800/50 p-2 rounded inline-flex border border-gray-700">
                    <a href="?source=discovery_results.json" class="text-blue-400 hover:text-blue-300">All-Time
                        Leaderboard</a>
                    <span class="text-gray-600">|</span>
                    <a href="?source=live_results_2026-03-07.json" class="text-orange-400 hover:text-orange-300">Live
                        Test (Mar 7)</a>
                    <span class="text-gray-600">|</span>
                    <a href="?source=live_results_2026-03-08.json" class="text-orange-400 hover:text-orange-300">Live
                        Test (Mar 8)</a>
                    <span class="text-gray-600">|</span>
                    <a href="?source=live_results_2026-03-09.json" class="text-indigo-400 hover:text-indigo-300">Live
                        Test (Mar 9)</a>
                </div>
            </div>
            <button onclick="loadData()"
                class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded text-white font-medium transition">
                Refresh Leaderboard
            </button>
        </div>

        <!-- Filters -->
        <div class="card p-4 rounded-lg border mb-6 flex gap-4 text-sm items-center">
            <span class="font-bold text-gray-300">Filters:</span>

            <label class="flex items-center space-x-2 text-gray-400">
                <span>Min Trades:</span>
                <input type="number" id="filter-trades" value="0"
                    class="w-16 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">
            </label>

            <label class="flex items-center space-x-2 text-gray-400">
                <span>Rule/Signal:</span>
                <input type="text" id="filter-strategy" placeholder="e.g. Markov"
                    class="w-32 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white placeholder-gray-500">
            </label>

            <label class="flex items-center space-x-2 text-gray-400">
                <span>Min Win Rate (%):</span>
                <input type="number" id="filter-winrate" value="0"
                    class="w-16 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">
            </label>

            <label class="flex items-center space-x-2 text-gray-400">
                <span>Max Drawdown (%):</span>
                <input type="number" id="filter-dd" value="100"
                    class="w-16 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">
            </label>

            <label class="flex items-center space-x-2 text-gray-400">
                <span>Min Profit ($):</span>
                <input type="number" id="filter-profit" value="-10000"
                    class="w-20 bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white">
            </label>

            <button onclick="applyFilters()"
                class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-white transition ml-auto">Apply</button>
        </div>

        <!-- Leaderboard Table -->
        <div class="card rounded-lg border overflow-hidden">
            <div class="overflow-x-auto max-h-[800px]">
                <table class="w-full text-sm text-left text-gray-300" id="leaderboard-table">
                    <thead class="text-xs uppercase bg-gray-800 text-gray-400 sticky top-0 z-10">
                        <tr>
                            <th scope="col" class="px-2 py-3">#</th>
                            <th scope="col" class="px-3 py-3 w-1/4">Signal (Param)</th>
                            <th scope="col" class="px-3 py-3 w-1/5">Sizing Rule</th>
                            <th scope="col" class="px-3 py-3 cursor-pointer sortable" data-sort="total_trades">Trades
                            </th>
                            <th scope="col" class="px-3 py-3 cursor-pointer sortable" data-sort="win_rate">Win Rate</th>
                            <th scope="col" class="px-3 py-3 cursor-pointer sortable" data-sort="max_dd">Max DD</th>
                            <th scope="col" class="px-3 py-3 text-center cursor-pointer sortable"
                                data-sort="max_series_losses">Max Streak</th>
                            <th scope="col" class="px-3 py-3 text-right cursor-pointer sortable" data-sort="net_profit">
                                Net Profit ($-)</th>
                            <th scope="col"
                                class="px-3 py-3 text-right cursor-pointer sortable group group-hover:bg-gray-700"
                                data-sort="calmar">
                                Risk-Adj Return (Calmar) &darr;</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-700">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hidden template for the expanded chart row -->
    <template id="chart-row-template">
        <tr class="chart-row">
            <td colspan="8" class="p-4 bg-gray-900 border-b border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-300 text-sm font-medium">Quick Equity View</span>
                    <a href="#" target="_blank"
                        class="detail-link px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-white text-xs font-bold shadow transition">Open
                        Full Stats Page</a>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-gray-800 p-4 rounded" style="height: 250px;">
                        <canvas class="eq-chart"></canvas>
                    </div>
                    <div class="bg-gray-800 p-4 rounded" style="height: 250px;">
                        <canvas class="dd-chart"></canvas>
                    </div>
                </div>
            </td>
        </tr>
    </template>

    <script>
        let fullData = [];
        let filteredData = [];
        let currentSort = { col: 'calmar', asc: false };
        let activeCharts = {}; // Track chart instances to destroy them

        async function loadData() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const sourceFile = urlParams.get('source') || 'discovery_results.json';

                const response = await fetch(sourceFile + '?' + new Date().getTime());
                if (!response.ok) throw new Error("File not found");
                const blob = await response.json();

                if (blob.title) {
                    document.getElementById('page-title').textContent = blob.title;
                }

                document.getElementById('gen-date').textContent = new Date(blob.generated_at).toLocaleString();
                document.getElementById('total-tested').textContent = blob.total_tested;

                fullData = blob.strategies;
                applyFilters();
            } catch (err) {
                console.error(err);
                alert("Could not load discovery_results.json.");
            }
        }

        function applyFilters() {
            const minTrades = parseInt(document.getElementById('filter-trades').value) || 0;
            const minWr = parseFloat(document.getElementById('filter-winrate').value) || 0;
            const maxDd = parseFloat(document.getElementById('filter-dd').value) || 100;
            const minProfit = parseFloat(document.getElementById('filter-profit').value) || -10000;
            const stratStr = document.getElementById('filter-strategy').value.toLowerCase().trim();

            filteredData = fullData.filter(s => {
                const matchesTrades = s.total_trades >= minTrades;
                const matchesWr = s.win_rate >= minWr;
                const matchesDd = s.max_dd <= maxDd;
                const matchesProfit = s.net_profit >= minProfit;
                const matchesStrat = stratStr === '' ||
                    s.signal.toLowerCase().includes(stratStr) ||
                    s.sizing.toLowerCase().includes(stratStr);

                return matchesTrades && matchesWr && matchesDd && matchesProfit && matchesStrat;
            });
            sortData();
        }

        function sortData() {
            filteredData.sort((a, b) => {
                let valA = a[currentSort.col];
                let valB = b[currentSort.col];

                // Rank is just the array index essentially, so sort by calmar instead
                if (currentSort.col === 'rank') { valA = a.calmar; valB = b.calmar; }

                if (valA < valB) return currentSort.asc ? -1 : 1;
                if (valA > valB) return currentSort.asc ? 1 : -1;
                return 0;
            });
            renderTable();
        }

        function toggleSort(col) {
            if (currentSort.col === col) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.col = col;
                currentSort.asc = false; // default desc for new col
            }

            // Update UI
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc', 'text-white');
                if (th.dataset.sort === col) {
                    th.classList.add(currentSort.asc ? 'sorted-asc' : 'sorted-desc', 'text-white');
                }
            });

            sortData();
        }

        document.querySelectorAll('th.sortable').forEach(th => {
            th.addEventListener('click', () => toggleSort(th.dataset.sort));
        });

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            // Cleanup old charts
            Object.values(activeCharts).forEach(c => c.destroy());
            activeCharts = {};

            filteredData.forEach((strat, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800 transition cursor-pointer main-row";
                tr.dataset.id = strat.id;

                // Format Signal Params
                const sigBadges = Object.entries(strat.signal_params)
                    .map(([k, v]) => `<span class="inline-block bg-gray-800 px-1.5 py-0.5 rounded border border-gray-700 text-gray-400">${k}=${v}</span>`)
                    .join('');
                const sigStr = `<div class="font-bold text-gray-200 mb-1">${strat.signal}</div><div class="text-[10px] flex flex-wrap gap-1">${sigBadges}</div>`;

                // Format Sizing Params
                const sizeStr = `<div class="font-medium text-gray-300">${strat.sizing}</div><div class="text-[10px] text-orange-400 mt-1 opacity-80">(Max L: ${strat.max_series_losses})</div>`;

                const pnlClass = strat.net_profit >= 0 ? 'positive font-medium' : 'negative';
                const calmarClass = strat.calmar > 0 ? 'positive font-bold' : 'negative';

                tr.innerHTML = `
                    <td class="px-2 py-2 text-gray-500 text-xs">#${index + 1}</td>
                    <td class="px-3 py-2 text-sm">${sigStr}</td>
                    <td class="px-3 py-2 text-sm">${sizeStr}</td>
                    <td class="px-3 py-2 font-medium text-gray-300 text-sm whitespace-nowrap">
                        ${strat.total_trades}
                        <div class="text-[10px] mt-0.5"><span class="text-green-400">${strat.wins || 0}W</span> <span class="text-red-400">${strat.losses || 0}L</span></div>
                    </td>
                    <td class="px-3 py-2 font-medium text-sm whitespace-nowrap ${strat.win_rate >= 50 ? 'text-green-400' : 'text-red-400'}">${strat.win_rate.toFixed(2)}%</td>
                    <td class="px-3 py-2 font-medium text-red-300 text-sm whitespace-nowrap">${strat.max_dd.toFixed(1)}%</td>
                    <td class="px-3 py-2 text-center text-orange-400 font-bold text-sm whitespace-nowrap">${strat.max_series_losses}</td>
                    <td class="px-3 py-2 text-right ${pnlClass} text-sm whitespace-nowrap">$${strat.net_profit.toFixed(2)}</td>
                    <td class="px-3 py-2 text-right ${calmarClass} text-sm whitespace-nowrap">${strat.calmar.toFixed(3)}</td>
                `;

                tr.addEventListener('click', () => toggleRowExpansion(tr, strat));
                tbody.appendChild(tr);
            });
        }

        function toggleRowExpansion(row, stratData) {
            const isExpanded = row.classList.contains('row-expanded');

            // Collapse all others
            document.querySelectorAll('.main-row').forEach(r => r.classList.remove('row-expanded'));
            document.querySelectorAll('.chart-row').forEach(r => r.remove());

            if (isExpanded) {
                // Already expanded, we just collapsed it
                return;
            }

            // Expand this one
            row.classList.add('row-expanded');

            const template = document.getElementById('chart-row-template');
            const clone = template.content.cloneNode(true);
            const chartRow = clone.querySelector('tr');

            // Insert exactly after the clicked row
            row.parentNode.insertBefore(chartRow, row.nextSibling);

            // Set Detail Link
            const detailLink = chartRow.querySelector('.detail-link');
            detailLink.href = `dashboard.html?config=${stratData.id}`;

            // Render Charts
            const cvsEq = chartRow.querySelector('.eq-chart').getContext('2d');
            const cvsDd = chartRow.querySelector('.dd-chart').getContext('2d');

            // Prepare Data
            const labels = [];
            const eqPts = [];
            const ddPts = [];

            stratData.equity_curve.forEach(pt => {
                labels.push(''); // No time labels needed for quick view
                eqPts.push(pt.equity);
                ddPts.push(-pt.drawdown);
            });

            Chart.defaults.color = '#94a3b8';

            activeCharts[`eq_${stratData.id}`] = new Chart(cvsEq, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Equity', data: eqPts,
                        borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true, pointRadius: 0, borderWidth: 2, tension: 0.1
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false } } }
            });

            activeCharts[`dd_${stratData.id}`] = new Chart(cvsDd, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Drawdown (%)', data: ddPts,
                        borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.2)',
                        fill: true, pointRadius: 0, borderWidth: 1, stepped: true
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { display: false } } }
            });
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
